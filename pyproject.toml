[project]
name = "example-app"
version = "0.1.0"
description = "A Flet example application."
requires-python = ">=3.10"
authors = [
    { name = "TheEthicalBoy", email = "the.ethical@boy.com" }
]

dependencies = [
    "flet>=0.81.0",
    "flet-audio>=0.81.0"
]

# Docs: https://flet.dev/docs/publish
[tool.flet]
org = "com.mycompany"
product = "flet-build-example"
build_number = 1

[tool.flet.app]
path = "src"
module = "main"
