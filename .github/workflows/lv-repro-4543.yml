name: lv-repro-4543

# Reproduces flet-dev/flet#4543 ("library load disallowed by system policy")
# with zero Apple Developer secrets: ad-hoc signing + hardened runtime is
# enough to trigger the same library validation that TestFlight/App Store
# builds are subject to.
#
# CAVEAT (verified empirically 2026-07-21): GitHub-hosted macOS runners ship
# with SIP DISABLED, which turns off AMFI library validation and Gatekeeper
# dylib checks — so on hosted runners the enforcement rows run unasserted
# (informational). Full assertions require a SIP-enabled Mac, e.g. a
# self-hosted runner. The script self-detects this via `csrutil status`.

on:
  push:
    branches: [lv-repro-4543]
    paths: ['lv-repro/**', '.github/workflows/lv-repro-4543.yml']
  workflow_dispatch:

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Run enforcement matrix
        run: bash lv-repro/run_matrix.sh
